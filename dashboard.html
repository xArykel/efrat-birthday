<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>רשימת מוזמנים · אפרת</title>
<style>
body{margin:0;font-family:system-ui,'Assistant',sans-serif;background:#f6f1ea;color:#1f3b3a}
.w{max-width:620px;margin:auto;padding:22px 14px 40px}h1{margin:0 0 6px;color:#1f6f6b;font-size:24px}
.sum{display:flex;gap:8px;margin:12px 0 18px;flex-wrap:wrap}.sum span{background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;box-shadow:0 1px 6px #0001}.sum b{color:#e07a3c}
.g{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 2px 10px #0001}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.n{font-weight:700;font-size:17px}
.bt{display:flex;gap:6px}.bt button{border:1.5px solid #cfc5b8;background:#fff;border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;color:#555}
.bt button.on.c{background:#1f6f6b;border-color:#1f6f6b;color:#fff}.bt button.on.x{background:#e07a3c;border-color:#e07a3c;color:#fff}
input{width:100%;box-sizing:border-box;margin-top:10px;border:1px solid #e8dfd4;border-radius:10px;padding:9px 11px;font-size:15px;font-family:inherit;background:#fbf8f4}
.st{font-size:12px;color:#8a7a6a;margin-top:5px;min-height:14px}
</style></head><body><div class="w"><h1>🎂 מי מגיע לאפרת</h1>
<div class="sum"><span>מגיעים: <b id="yes">0</b></span><span>לא מגיעים: <b id="no">0</b></span><span>לא סומן: <b id="wt">0</b></span></div>
<div id="list">טוען...</div></div>
<script>
const KEY=new URLSearchParams(location.search).get('k')||'',SB='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxnbm5sZWltcXdnbmdsem53eWhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODgwNTUsImV4cCI6MjEwMTg2NDA1NX0.6jATYqxEJ3bxMEuHNDLHpbbB0miVti9YfDR566zKOhY',API='https://lgnnleimqwgnglznwyhp.supabase.co/rest/v1/rpc/';
const H={apikey:SB,Authorization:'Bearer '+SB,'Content-Type':'application/json'};let rows=[];
const call=(f,b)=>fetch(API+f,{method:'POST',headers:H,body:JSON.stringify(b)});
const st=a=>!a?null:(a==='not_coming'?'not_coming':'coming');
function sum(){let y=0,n=0,w=0;rows.forEach(r=>{const s=st(r.attendance);s==='coming'?y++:s==='not_coming'?n++:w++});yes.textContent=y;no.textContent=n;wt.textContent=w}
async function save(r,el,msg){msg.textContent='שומר...';const res=await call('admin_mark',{p_key:KEY,p_token:r.token,p_attendance:st(r.attendance),p_note:r.note||''});msg.textContent=res.ok?'נשמר ✓':'שגיאה בשמירה, נסה שוב';sum()}
function render(){const L=document.getElementById('list');L.innerHTML='';rows.forEach(r=>{
const d=document.createElement('div');d.className='g';const t=document.createElement('div');t.className='top';const n=document.createElement('div');n.className='n';n.textContent=r.name;
const bt=document.createElement('div');bt.className='bt';const msg=document.createElement('div');msg.className='st';
const mk=(label,val,cls)=>{const b=document.createElement('button');b.textContent=label;b.className=cls+(st(r.attendance)===val?' on':'');b.onclick=()=>{const cur=st(r.attendance);r.attendance=cur===val?null:(val==='coming'?'couple':'not_coming');bt.querySelectorAll('button').forEach(x=>x.classList.remove('on'));if(r.attendance)b.classList.add('on');save(r,d,msg)};return b};
bt.append(mk('מגיעים ✓','coming','c'),mk('לא מגיעים','not_coming','x'));t.append(n,bt);
const inp=document.createElement('input');inp.placeholder='הערה קצרה...';inp.maxLength=200;inp.value=r.note||'';let tm;inp.oninput=()=>{r.note=inp.value;clearTimeout(tm);msg.textContent='...';tm=setTimeout(()=>save(r,d,msg),800)};
d.append(t,inp,msg);L.appendChild(d)});sum()}
(async()=>{const r=await call('get_dashboard',{p_key:KEY});if(!r.ok){list.textContent='אין גישה. צריך את הקישור המלא.';return}rows=await r.json();render()})();
</script></body></html>
